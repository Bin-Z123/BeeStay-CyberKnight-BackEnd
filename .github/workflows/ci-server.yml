name: CI Server BeeStay
on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Format code with Spotless
        run: mvn spotless:apply

      # Xử lý file cấu hình
      - name: Create application.yml
        if: github.ref_name == 'develop'
        run: echo "${{ secrets.DEV_YML }}" > src/main/resources/application.yml

      - name: Create application.yml for Prod
        if: github.ref_name == 'main'
        run: echo "${{ secrets.PROD_YML }}" > src/main/resources/application.yml

      - name: Build with Maven (skip Tests)
        run: mvn clean install -DskipTests
      # Đăng nhập Docker Hub và push Image
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      # Push Image
      - name: Build and push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/beestay:${{ github.ref_name == 'main' && 'latest' || 'develop' }}
